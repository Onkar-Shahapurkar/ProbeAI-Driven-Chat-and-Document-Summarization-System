<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0 maximum-scale=1.0">
        <title>ProbeAI - Login</title>

        <link rel="icon" type="image/png" sizes="128x128" href="./assets/icons/favicon-128x128.png">
        <link rel="stylesheet" href="./assets/login2.css">
        <link rel="stylesheet" href="./assets/login.css">
    </head>

    <body>
        <div class="probeAI-header"></div>
            <!-- Login Modal -->
            <div id="login-modal">
                <img class="probeAI-logo" src="./assets/icons/favicon-128x128.png" alt="probeAI"></img>
                <div class="login-modal-title">Login to probeAI</div>
                <!-- Sign in with Magic Link -->
                <div class="probeAI-magic-link">
                    <input type="email" id="email" placeholder="Email" required>
                    <button id="magic-link-button">Send Magic Link</button>
                </div>            
            </div>

            <div class="probeAI-footer"></div>
        </div>
    </body>

    <script>
        const magicLinkButton = document.getElementById('magic-link-button');
        const emailInput = document.getElementById('email');

        magicLinkButton.addEventListener('click', async () => {
            const email = emailInput.value;
            if (!email) {
                alert('Please enter a valid email address');
                return;
            }

            if (!email.includes('@')) {
                alert('Please enter a valid email address');
                return;
            }

            magicLinkButton.disabled = true;
            magicLinkButton.innerText = 'Check your email for a sign-in link!';

            window.location.href = "chat.html";
        });
    </script>
</html>
